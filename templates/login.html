{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div>
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class=" flex justify-center">
            <img src="/static/logo.png" alt="ExTrInOut Logo" class="w-64">
        </div>
        <h1 class="text-2xl font-semibold text-center text-gray-800">
            Log In
        </h1>
        <form action="/login" method="post" class="w-full max-w-md rounded-2xl p-8 space-y-6">
            <input autocomplete="off" autofocus name="username" type="text" placeholder="Username" class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
            <input name="password" type="password" placeholder="Password" class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
            <button type="submit" class="w-full rounded-lg bg-blue-500 py-2 text-white font-medium hover:bg-blue-600 transition">
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
